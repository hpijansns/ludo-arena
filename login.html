<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Ludo Arena</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            🎲 Ludo Arena
        </div>

        <nav>
            <a href="index.html">
                Home
            </a>

            <a href="game.html">
                Play
            </a>

            <a href="register.html">
                Register
            </a>
        </nav>

    </header>


    <!-- ================= LOGIN ================= -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                👤
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to continue playing Ludo.
            </p>


            <!-- Login Form -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="name">
                        Player Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        maxlength="20"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        minlength="4"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Remember -->

                <div class="remember-row">

                    <label>
                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me
                    </label>

                    <a href="#">
                        Forgot?
                    </a>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn auth-btn"
                >
                    🔐 Login
                </button>

            </form>


            <!-- Error / Success Message -->

            <div
                id="loginMessage"
                class="auth-message"
                aria-live="polite"
            ></div>


            <!-- Register -->

            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <!-- Continue as Guest -->

            <a
                href="game.html"
                class="guest-link"
            >
                Continue as Guest
            </a>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Ludo Arena · Free Play
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/auth.js"></script>

</body>

</html>
