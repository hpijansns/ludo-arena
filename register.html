<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Ludo Arena</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <header>

        <div class="logo">
            🎲 Ludo Arena
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="game.html">Play</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                🎮
            </div>

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Create your Ludo Arena player profile.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="username">
                        Player Name
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter player name"
                        maxlength="20"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create password"
                        minlength="4"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm password"
                        minlength="4"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the Terms & Conditions
                    </span>

                </label>


                <button
                    type="submit"
                    class="btn auth-btn"
                >
                    🚀 Create Account
                </button>

            </form>


            <div
                id="registerMessage"
                class="auth-message"
                aria-live="polite"
            ></div>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="game.html"
                class="guest-link"
            >
                Continue as Guest
            </a>

        </div>

    </main>


    <footer>

        <p>
            © 2026 Ludo Arena · Free Play
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
